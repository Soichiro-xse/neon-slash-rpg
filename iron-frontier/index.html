<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>NEON FOUNDRY</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#071018;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.load{text-align:center}.ring{width:44px;height:44px;margin:0 auto 16px;border:3px solid #26374f;border-top-color:#62e8ff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#91a5bb}</style></head><body><div class="load"><div class="ring"></div><b>NEON FOUNDRY</b><br><small>工場システムを起動中</small></div><script>(async()=>{try{const v='nf-0d090f8ee0b0';const names=['p0.txt','p1.txt','b20.txt','b21.txt','b30.txt','b31.txt'];const p=await Promise.all(names.map(n=>fetch('assets/'+n+'?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n+' HTTP '+r.status);return r.text()})));const dec=s=>{const b=atob(s.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)};const html=p[0]+p[1]+dec(p[2]+p[3])+dec(p[4]+p[5]);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;text-align:center"><h2>読み込みに失敗しました</h2><p>'+String(e)+'</p><button onclick="location.reload()" style="padding:12px 20px">再読み込み</button></div>'}})()</script></body></html>
