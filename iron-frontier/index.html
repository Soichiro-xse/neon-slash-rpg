<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>IRON FRONTIER</title><style>
:root{--b:#07111b;--p:#102131;--l:#2d4b62;--t:#eef8ff;--m:#9bb1c2;--c:#67e1ff;--r:#ff6678;--g:#6de6a0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:linear-gradient(#081522,#05090d);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}#app{max-width:720px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-weight:900;letter-spacing:.08em}.logo small{display:block;color:var(--c);font-size:9px}.pill{border:1px solid var(--l);background:#0c1924;border-radius:999px;padding:5px 8px;font-size:12px}.screen{display:none}.screen.on{display:block}.panel{border:1px solid var(--l);background:linear-gradient(#14293b,#0d1b28);border-radius:16px;padding:13px;margin-top:10px;box-shadow:0 12px 30px #0005}h1,h2,h3,p{margin-top:0}.muted{color:var(--m);font-size:12px;line-height:1.55}.btn{width:100%;border:1px solid #3d607b;background:linear-gradient(#1b3b55,#132a3e);border-radius:13px;padding:13px 11px;margin-top:8px;text-align:left;box-shadow:0 4px 0 #030609}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #030609}.btn b{display:block}.btn span{display:block;color:var(--m);font-size:11px;margin-top:3px}.primary{border-color:#56bfd4;background:linear-gradient(#17556b,#103a4b)}.danger{border-color:#8a4551;background:#431e26}.stats,.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.unit{border:1px solid var(--l);background:#09141e;border-radius:12px;padding:9px;text-align:center}.stat b{font-size:19px}.stat small{display:block;color:var(--m)}.map{display:grid;gap:7px}.node{width:100%;border:1px solid var(--l);background:#0d1b28;border-radius:12px;padding:12px;display:flex;justify-content:space-between;text-align:left}.node.now{border-color:va </style></head><body><div id="app"><div class="top"><div class="logo">IRON FRONTIER<small>TOUCH ROGUELITE</small></div><div><span class="pill">🪙 <b id="gold">0</b></span> <span class="pill">◆ <b id="cores">0</b></span></div></div><div id="err"></div>
<section id="home" class="screen on"><div class="panel"><h1>荒廃圏を突破せよ</h1><p class="muted">カードをタップして戦うスマホ用デッキ構築ローグライトです。20区画、エリート、修理、イベント、ボス、恒久強化があります。</p><div class="stats"><div class="stat"><b id="best">0</b><small>最高区画</small></div><div class="stat"><b id="runs">0</b><small>遠征回数</small></div><div class="stat"><b id="wins">0</b><small>制覇回数</small></div></div><button id="start" class="btn primary"><b>新規遠征を開始</b><span>ここをタップ</span></button><button id="cont" class="btn"><b>遠征を再開</b></button></div></section>
<section id="map" class="screen"><div class="panel"><h2>遠征マップ</h2><div id="mapList" class="map"></div></div></section>
<section id="fight" class="screen"><div class="bars"><div class="unit"><b>自機</b><div id="pt" class="tiny"></div><div class="bar"><div id="php" class="fill hp"></div></div><div class="tiny">装甲 <span id="at">0</span></div><div class="bar"><div id="ab" class="fill ar"></div></div></div><div class="unit"><b id="ename">敵</b><div id="et" class="tiny"></div><div class="bar"><div id="ehp" class="fill hp"></div></div><div id="intent" class="tiny"></div></div><div class="unit"><b>EN</b><div id="ent" class="tiny"></div><div class="bar"><div id="enb" class="fill en"></div></div></div></div><div class="panel"><div id="hand" class="hand"></div><button id="end" class="btn primary"><b>ターン終了</b><span>敵の行動へ</span></button></div><div id="log" class="log"></div></section>
<section id="reward" class="screen"><div class="panel"><h2 id="rtitle">報酬</h2><p id="rtext" class="muted"></p><div id="rlist"></div><button id="skip" class="btn"><b>取得せず進む</b></button></div></section>
<section id="deck" class="screen"><div class="panel"><h2>デッキ</h2><div id="deckList"></div></div></section>
<section id="lab" class="screen"><div class="panel"><h2>研究所</h2><div id="labList"></div><button id="reset" class="btn danger"><b>全データ初期化</b></button></div></section>
<nav class="menu"><button data-go="home" class="active">司令室</button><button data-go="map">マップ</button><button data-go="deck">デッキ</button><button data-go="lab">研究</button></nav></div><div id="toast"></div>
<script>(function(){'use strict';var K='iron_frontier_mobile_v5',mem='',BASE={meta:{cores:0,best:0,runs:0,wins:0,research:{hull:0,reactor:0,draw:0,power:0}},run:null};function $(x){return document.getElementById(x)}function qa(x){return Array.prototype.slice.call(document.querySelectorAll(x))}function cp(x){return JSON.parse(JSON.stringify(x))}window.onerror=function(m,s,l,c){$('err').style.display='block';$('err').textContent='エラー: '+m+'\n'+l+':'+c};function rd(){try{return localStorage.getItem(K)||mem||''}catch(e){return mem||''}}function wr(v){mem=v;try{localStorage.setItem(K,v)}catch(e){}}function load(){try{var x=JSON.parse(rd()||'null');if(!x)return cp(BASE);x.meta=x.meta||cp(BASE.meta);x.meta.research=Object.assign({},BASE.meta.research,x.meta.research||{});return x}catch(e){return cp(BASE)}}var S=load(),R=S.run;
var C={strike:{n:'パルス射撃',c:1,t:'6ダメージ',f:function(x){hit(6+x.u*3)}},guard:{n:'展開装甲',c:1,t:'装甲5',f:function(x){arm(5+x.u*3)}},burst:{n:'三連射',c:2,t:'3ダメージ×3',f:function(x){hit(3+x.u);hit(3+x.u);hit(3+x.u)}},rail:{n:'レール砲',c:3,t:'25ダメージ',f:function(x){hit(25+x.u*7)}},repair:{n:'緊急修理',c:2,t:'HP8回復',f:function(x){heal(8+x.u*3)}},draw:{n:'戦術演算',c:1,t:'2枚引く',f:function(x){draw(2+x.u)}},poison:{n:'腐食弾',c:1,t:'4ダメージ・毒3',f:function(x){hit(4+x.u*2);R.enemy.poison+=3+x.u}},barrier:{n:'反応障壁',c:1,t:'装甲7',f:function(x){arm(7+x.u*2)}},drone:{n:'攻撃ドローン',c:2,t:'毎ターン4ダメージ',f:function(x){R.player.drone+=4+x.u*2}},over:{n:'過剰出力',c:0,t:'EN+1・HP-2',f:function(){R.player.energy++;R.player.hp-=2}}};var N=[['廃棄ドローン',34,[6,8,5]],['略奪機',44,[8,10,7]],['重装車',56,[11,8,13]]],E=[['黒鉄の監視者',92,[14,11,17]],['双頭戦車',106,[10,19,12]]],B=[['MOTHER',175,[17,12,23,15]],['HELIOS',215,[21,15,27,18]]];function save(){S.run=R;wr(JSON.stringify(S));ui()}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){$('toast').classList.remove('show')},1100)}function go(id){qa('.screen').forEach(function(x){x.classList.remove('on')});$(id).classList.add('on');qa('.menu button').forEach(function(x){x.classList.toggle('active',x.dataset.go===id)});if(id==='map')map();if(id==='deck')deck();if(id==='lab')lab();scrollTo(0,0)}function sh(a){for(var i=a.length-1;i;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function card(id,u){return{id:id,u:u||0}}function makeMap(){var a=[];for(var i=1;i<=20;i++){var t=i===10||i===20?'boss':i%6===0?'elite':Math.random()<.68?'combat':Math.random()<.55?'repair':'event';a.push({floor:i,type:t,done:false})}return a}function newRun(){S.meta.runs++;var z=S.meta.research;R={floor:0,node:0,gold:50,player:{hp:72+z.hull*8,maxHp:72+z.hull*8,armor:0,energy:3+z.reactor,draw:5+z.draw,drone:0},deck:[card('strike'),card('strike'),card('strike'),card('strike'),card('strike'),card('guard'),card('guard'),card('guard'),card('guard'),card('burst')],map:makeMap(),hand:[],pile:[],discard:[],enemy:null,inCombat:false};save();go('map');toast('遠征開始')}function map(){var e=$('mapList');if(!R){e.innerHTML='<p class="muted">遠征を開始してください。</p>';return}var nm={combat:'戦闘',elite:'エリート',boss:'ボス',repair:'修理',event:'イベント'},ic={combat:'⚔️',elite:'☠️',boss:'👁️',repair:'🛠️',event:'❓'};e.innerHTML='';R.map.forEach(function(n,i){var b=document.createElement('button');b.className='node '+(i===R.node?'now':'');b.disabled=i!==R.node;b.innerHTML='<span><b>'+ic[n.type]+' 区画 '+n.floor+'</b><br><small>'+nm[n.type]+'</small></span><span>'+(n.done?'完了':i===R.node?'進入':'封鎖')+'</span>';b.onclick=function(){enter(n)};e.appendChild(b)})}function enter(n){if(n.type==='combat'||n.type==='elite'||n.type==='boss')fight(n.type);else if(n.type==='repair')repairNode();else eventNode()}function enemy(type){var b=pick(type==='boss'?B:type==='elite'?E:N),s=1+R.floor*.065;return{name:b[0],maxHp:Math.floor(b[1]*s),hp:Math.floor(b[1]*s),atk:b[2],turn:0,poison:0,type:type}}function fight(type){R.enemy=enemy(type);R.player.armor=0;R.player.drone=0;R.pile=sh(R.deck.map(cp));R.discard=[];R.hand=[];R.inCombat=true;$('log').innerHTML='';turn(true);go('fight')}function draw(n){for(var i=0;i<n;i++){if(!R.pile.length){if(!R.discard.length)break;R.pile=sh(R.discard.splice(0))}R.hand.push(R.pile.pop())}}function lg(t){$('log').innerHTML+='・'+t+'<br>';$('log').scrollTop=$('log').scrollHeight}function hit(n){n+=S.meta.research.power*2;R.enemy.hp=Math.max(0,R.enemy.hp-n);lg('敵に'+n+'ダメージ')}function arm(n){R.player.armor+=n;lg('装甲+'+n)}function heal(n){var o=R.player.hp;R.player.hp=Math.min(R.player.maxHp,R.player.hp+n);lg('HP+'+(R.player.hp-o))}function turn(first){if(!first)R.player.armor=0;R.player.energy=3+S.meta.research.reactor;if(R.player.drone)hit(R.player.drone);draw(R.player.draw);render()}function play(i){var x=R.hand[i],d=C[x.id];if(!x||d.c>R.player.energy)return;R.player.energy-=d.c;R.hand.splice(i,1);R.discard.push(x);d.f(x);lg(d.n+'使用');if(R.player.hp<=0)return lose();if(R.enemy.hp<=0)return win();render();save()}function intent(){return R.enemy.atk[R.enemy.turn%R.enemy.atk.length]+Math.floor(R.floor*.4)}function end(){if(!R||!R.inCombat)return;R.discard=R.discard.concat(R.hand.splice(0));if(R.enemy.poison){var p=R.enemy.poison;R.enemy.hp=Math.max(0,R.enemy.hp-p);R.enemy.poison--;lg('毒'+p);if(R.enemy.hp<=0)return win()}var a=intent();R.enemy.turn++;var block=Math.min(a,R.player.armor);R.player.armor-=block;R.player.hp-=a-block;lg('敵攻撃 '+a+' / 被害 '+(a-block));if(R.player.hp<=0)return lose();turn(false);save()}function render(){$('pt').textContent='HP '+Math.max(0,R.player.hp)+'/'+R.player.maxHp;$('php').style.width=Math.max(0,R.player.hp/R.player.maxHp*100)+'%';$('at').textContent=R.player.armor;$('ab').style.width=Math.min(100,R.player.armor/30*100)+'%';$('ent').textContent=R.player.energy;$('enb').style.width=Math.min(100,R.player.energy/6*100)+'%';$('ename').textContent=R.enemy.name;$('et').textContent='HP '+R.enemy.hp+'/'+R.enemy.maxHp;$('ehp').style.width=Math.max(0,R.enemy.hp/R.enemy.maxHp*100)+'%';$('intent').textContent='次の攻撃 '+intent()+(R.enemy.poison?' / 毒 '+R.enemy.poison:'');var h=$('hand');h.innerHTML='';R.hand.forEach(function(x,i){var d=C[x.id],b=document.createElement('button');b.className='card';b.disabled=d.c>R.player.energy;b.innerHTML='<span class="cost">'+d.c+'</span><h3>'+d.n+(x.u?' +':'')+'</h3><p>'+d.t+'</p>';b.onclick=function(){play(i)};h.appendChild(b)});ui()}function rewards(){return sh(Object.keys(C).filter(function(x){return x!=='strike'&&x!=='guard'})).slice(0,3)}function win(){R.inCombat=false;R.gold+=R.enemy.type==='boss'?90:R.enemy.type==='elite'?45:22;reward('戦闘勝利','カードを1枚選択',rewards().map(function(id){return[id,C[id].n,C[id].t,function(){R.deck.push(card(id));finish()}]}));save()}function reward(title,text,items){$('rtitle').textContent=title;$('rtext').textContent=text;var e=$('rlist');e.innerHTML='';items.forEach(function(x){var b=document.createElement('button');b.className='btn';b.innerHTML='<b>'+x[1]+'</b><span>'+x[2]+'</span>';b.onclick=x[3];e.appendChild(b)});go('reward')}function finish(){R.map[R.node].done=true;R.floor=R.map[R.node].floor;R.node++;if(R.floor>=20){S.meta.wins++;S.meta.best=Math.max(S.meta.best,20);S.meta.cores+=12;R=null;save();reward('遠征制覇','研究コア12獲得',[]);return}save();go('map')}function repairNode(){var n=Math.floor(R.player.maxHp*.3);reward('修理区画','どちらか選択',[[0,'HPを'+n+'回復','機体修復',function(){heal(n);finish()}],[0,'カード強化','ランダム1枚を強化',function(){pick(R.deck).u++;finish()}]])}function eventNode(){reward('漂流コンテナ','危険な物資反応',[[0,'HPを7失いカード2枚','危険を冒す',function(){R.player.hp-=7;if(R.player.hp<=0)return lose();var x=rewards();R.deck.push(card(x[0]),card(x[1]));finish()}],[0,'通過','何も起こらない',finish]])}function lose(){S.meta.best=Math.max(S.meta.best,R.floor);S.meta.cores+=Math.max(1,Math.floor((R.floor+1)/3));R=null;save();reward('遠征失敗','研究コアを獲得しました',[])}function deck(){var e=$('deckList');if(!R){e.innerHTML='<p class="muted">遠征中ではありません。</p>';return}var g={};R.deck.forEach(function(x){var k=x.id+'_'+x.u;g[k]=(g[k]||0)+1});e.innerHTML='';Object.keys(g).forEach(function(k){var p=k.split('_'),d=C[p[0]],x=document.createElement('div');x.className='panel';x.innerHTML='<b>'+d.n+(+p[1]?' +':'')+'</b><div class="muted">×'+g[k]+' / Cost '+d.c+' / '+d.t+'</div>';e.appendChild(x)})}function lab(){var a=[['hull','強化船殻','最大HP+8'],['reactor','高効率炉','初期EN+1'],['draw','戦術メモリ','ドロー+1'],['power','火器管制','全攻撃+2']],e=$('labList');e.innerHTML='';a.forEach(function(x){var lv=S.meta.research[x[0]],cost=3+lv*3,b=document.createElement('button');b.className='btn';b.innerHTML='<b>'+x[1]+' Lv.'+lv+'</b><span>'+x[2]+' / ◆'+cost+'</span>';b.onclick=function(){if(S.meta.cores<cost)return toast('コア不足');S.meta.cores-=cost;S.meta.research[x[0]]++;save();lab()};e.appendChild(b)})}function ui(){$('gold').textContent=R?R.gold:0;$('cores').textContent=S.meta.cores;$('best').textContent=S.meta.best;$('runs').textContent=S.meta.runs;$('wins').textContent=S.meta.wins;$('cont').style.display=R?'block':'none'}$('start').onclick=function(){if(R&&!confirm('現在の遠征を破棄しますか？'))return;newRun()};$('cont').onclick=function(){if(!R)return;if(R.inCombat){render();go('fight')}else go('map')};$('end').onclick=end;$('skip').onclick=function(){if(!R){$('skip').innerHTML='<b>取得せず進む</b>';go('home')}else finish()};$('reset').onclick=function(){if(confirm('全データを削除しますか？')){mem='';try{localStorage.removeItem(K)}catch(e){}S=cp(BASE);R=null;ui();go('home')}};qa('.menu button').forEach(function(b){b.onclick=function(){var id=b.dataset.go;if(id==='map'&&!R)return toast('遠征を開始してください');go(id)}});ui();map();deck();lab();if(R&&R.inCombat&&R.enemy)render()})();</script></body></html>
