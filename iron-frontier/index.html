<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>NEON SIEGE</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#070b12;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.load{text-align:center}.ring{width:44px;height:44px;margin:0 auto 16px;border:3px solid #26374f;border-top-color:#68e8ff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#91a5bb}</style></head><body><div class="load"><div class="ring"></div><b>NEON SIEGE</b><br><small>ゲームを読み込み中</small></div><script>(async()=>{try{const v='414d9e8';const ps=await Promise.all([0,1,2,3].map(i=>fetch('assets/p'+i+'.txt?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()})));document.open();document.write(ps.join(''));document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;text-align:center"><h2>読み込みに失敗しました</h2><p>'+String(e)+'</p><button onclick="location.reload()" style="padding:12px 20px">再読み込み</button></div>'}})()</script></body></html>
